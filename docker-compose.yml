# Local dev stack: app + postgres (+ optional ollama for the local scoring tier).
services:
  app:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobpipeline
      POSTGRES_PASSWORD: jobpipeline
      POSTGRES_DB: jobpipeline
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpipeline"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Optional local model tier. Uncomment to use.
  # ollama:
  #   image: ollama/ollama:latest
  #   ports: ["11434:11434"]
  #   volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  # ollama:
