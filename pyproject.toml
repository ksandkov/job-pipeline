[project]
name = "jobpipeline"
version = "0.1.0"
description = "Scrape job postings, score them with an LLM, and serve the good ones."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "anthropic>=0.39",
  "httpx>=0.27",
  "structlog>=24.4",
  "prometheus-client>=0.20",
  "typer>=0.12",
  "python-jobspy>=1.1.70",
  "curl-cffi>=0.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
jobpipeline = "jobpipeline.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI's dependency injection intentionally calls Depends() in
# argument defaults — that is the framework's documented API, not the
# mutable-default-argument bug this rule targets.
"src/jobpipeline/api/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --cov=jobpipeline --cov-report=term-missing"
